<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --button-bg: #2a2a2a;
            --accent-yellow: #f1c40f;
            --accent-green: #27ae60;
            --text-color: #ffffff;
            --text-muted: #aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: #181818;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* LOGO & CABEÇALHO */
        .logo-box {
            border: 2px dashed #666;
            padding: 15px;
            text-align: center;
            margin: 10px auto;
            width: 140px;
            border-radius: 8px;
        }

        .logo-box h3 { font-size: 14px; letter-spacing: 2px; }
        .logo-box h2 { font-size: 18px; font-weight: bold; }

        .title-main {
            text-align: center;
            font-size: 28px;
            letter-spacing: 2px;
            margin: 20px 0;
            font-weight: 800;
        }

        /* BOTÕES MENU PRINCIPAL */
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-menu {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 18px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        .btn-delivery {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            width: 100%;
        }

        .banner-img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            object-fit: cover;
            height: 200px;
        }

        .callout {
            text-align: center;
            margin-bottom: 20px;
        }

        .callout p {
            font-family: 'Georgia', serif;
            font-style: italic;
            color: var(--accent-yellow);
            font-size: 18px;
        }

        .callout h3 {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: auto;
        }

        .btn-social {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* TELA DE ITENS */
        .header-category {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .header-category h2 {
            font-size: 24px;
            text-transform: uppercase;
        }

        .header-category span {
            font-family: 'Georgia', serif;
            font-style: italic;
            color: var(--accent-yellow);
            font-size: 14px;
            display: block;
        }

        .icon-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .item-card {
            margin-bottom: 20px;
            border-bottom: 1px dashed #333;
            padding-bottom: 15px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .item-title {
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
        }

        .item-price {
            color: var(--accent-yellow);
            font-weight: bold;
            font-size: 18px;
        }

        .item-desc {
            color: var(--text-muted);
            font-size: 11px;
            margin: 5px 0 10px 0;
            text-transform: uppercase;
        }

        /* CONTADOR DE QUANTIDADE */
        .counter-box {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-counter {
            background-color: var(--button-bg);
            color: white;
            border: 1px solid #555;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-value {
            font-weight: bold;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* ABAS DE SELEÇÃO DE LANCHE EM ADICIONAIS */
        .burger-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: var(--button-bg);
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--accent-yellow);
            color: black;
            font-weight: bold;
            border-color: var(--accent-yellow);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-nav {
            flex: 1;
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-next {
            background-color: var(--accent-yellow);
            color: #000;
        }

        /* FORMULÁRIO CHECKOUT */
        .checkout-summary {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .summary-add-on {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 15px;
            display: flex;
            justify-content: space-between;
        }

        .summary-total {
            border-top: 1px solid #444;
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
            color: var(--accent-yellow);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: white;
            font-size: 14px;
        }

        .btn-finish {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- TELA 1: HOME / MENU PRINCIPAL -->
    <div id="screen-home" class="screen active">
        <div class="logo-box">
            <h3>SUA</h3>
            <h2>LOGO</h2>
            <h3>AQUI</h3>
        </div>

        <h1 class="title-main">CARDÁPIO</h1>

        <div class="grid-menu">
            <button class="btn-menu" onclick="showScreen('screen-hamb')">Hambúrguer</button>
            <button class="btn-menu" onclick="showScreen('screen-bebidas')">Bebidas</button>
        </div>

        <button class="btn-delivery">
            Delivery (00) 0000-0000 💬
        </button>

        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=600&q=80" alt="Hambúrguer e Batata" class="banner-img">

        <div class="callout">
            <p>Está com Fome?</p>
            <h3>PEÇA LOGO O SEU!</h3>
        </div>

        <div class="social-buttons">
            <button class="btn-social">CURTIR 👍</button>
            <button class="btn-social">SEGUIR 📸</button>
        </div>
    </div>

    <!-- TELA 2: CARDÁPIO DE HAMBÚRGUERES -->
    <div id="screen-hamb" class="screen">
        <div class="header-category">
            <div>
                <h2>Hambúrguer</h2>
                <span>gourmet</span>
            </div>
            <div class="icon-badge">🍔</div>
        </div>

        <div id="hamb-list"></div>

        <div class="nav-buttons">
            <button class="btn-nav" onclick="showScreen('screen-home')">← Voltar</button>
            <button class="btn-nav btn-next" onclick="goToAddons()">Avançar ➔</button>
        </div>
    </div>

    <!-- TELA 3: ADICIONAIS POR LANCHE -->
    <div id="screen-addons" class="screen">
        <div class="header-category">
            <div>
                <h2>Adicionais</h2>
                <span>personalize seu lanche</span>
            </div>
            <div class="icon-badge">🧀</div>
        </div>

        <div class="burger-tabs" id="burger-tabs"></div>
        <div id="addons-list"></div>

        <div class="nav-buttons">
            <button class="btn-nav" onclick="showScreen('screen-hamb')">← Voltar</button>
            <button id="btn-addons-next" class="btn-nav btn-next" onclick="showScreen('screen-bebidas')">Pular</button>
        </div>
    </div>

    <!-- TELA 4: CARDÁPIO DE BEBIDAS -->
    <div id="screen-bebidas" class="screen">
        <div class="header-category">
            <div>
                <h2>Bebidas</h2>
                <span>refrescantes</span>
            </div>
            <div class="icon-badge">🥤</div>
        </div>

        <div id="bebidas-list"></div>

        <div class="nav-buttons">
            <button class="btn-nav" onclick="showScreen('screen-addons')">← Voltar</button>
            <button id="btn-bebidas-next" class="btn-nav btn-next" onclick="showScreen('screen-checkout')">Pular</button>
        </div>
    </div>

    <!-- TELA 5: CHECKOUT / PAGAMENTO -->
    <div id="screen-checkout" class="screen">
        <div class="header-category">
            <div>
                <h2>Finalizar</h2>
                <span>seu pedido</span>
            </div>
            <div class="icon-badge">🛒</div>
        </div>

        <div class="checkout-summary" id="checkout-summary"></div>

        <form id="order-form" onsubmit="sendOrder(event)">
            <div class="form-group">
                <label>Nome Completo*</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label>Rua / Avenida*</label>
                <input type="text" id="rua" required placeholder="Ex: Rua das Flores">
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Número*</label>
                    <input type="text" id="numero" required placeholder="123">
                </div>
                <div style="flex: 2;">
                    <label>Bairro*</label>
                    <input type="text" id="bairro" required placeholder="Centro">
                </div>
            </div>

            <div class="form-group">
                <label>Ponto de Referência* (Para não errar o endereço)</label>
                <input type="text" id="referencia" required placeholder="Ex: Próximo à padaria X">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento*</label>
                <select id="pagamento" required onchange="toggleTroco(this.value)">
                    <option value="Cartão">Cartão (Débito/Crédito)</option>
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>

            <div class="form-group" id="troco-group" style="display: none;">
                <label>Precisa de troco para quanto?</label>
                <input type="text" id="troco" placeholder="Ex: Troco para R$ 50,00">
            </div>

            <button type="submit" class="btn-finish">Enviar Pedido pelo WhatsApp</button>
            <button type="button" class="btn-nav" style="width: 100%; margin-top: 10px;" onclick="showScreen('screen-bebidas')">← Voltar</button>
        </form>
    </div>

</div>

<script>
    const hamburgueres = [
        { id: 'h1', name: 'X FILÉ ESPECIAL', price: 24.00, desc: 'HAMBÚRGUER ARTESANAL 150G, ALFACE, TOMATE, QUEIJO, OVOS, BACON, BATATA PALHA' },
        { id: 'h2', name: 'X TURBINADO', price: 12.00, desc: 'HAMBÚRGUER ARTESANAL 150G, ALFACE, TOMATE, QUEIJO, OVOS, BACON, BATATA PALHA' },
        { id: 'h3', name: 'X BACON DUPLO', price: 18.00, desc: 'HAMBÚRGUER ARTESANAL 150G, ALFACE, TOMATE, QUEIJO, OVOS, BACON, BATATA PALHA' },
        { id: 'h4', name: 'TRIPLO X', price: 18.00, desc: 'HAMBÚRGUER ARTESANAL 150G, ALFACE, TOMATE, QUEIJO, OVOS, BACON, BATATA PALHA' },
        { id: 'h5', name: 'X FRANGO C/ BACON', price: 12.00, desc: 'HAMBÚRGUER ARTESANAL 150G, ALFACE, TOMATE, QUEIJO, OVOS, BACON, BATATA PALHA' },
        { id: 'h6', name: 'X HOT DOG', price: 9.00, desc: 'HAMBÚRGUER ARTESANAL 150G, ALFACE, TOMATE, QUEIJO, OVOS, BACON, BATATA PALHA' }
    ];

    const listaAdicionais = [
        { id: 'a1', name: 'FRANGO', price: 4.00 },
        { id: 'a2', name: 'HAMBÚRGUER Extra', price: 5.00 },
        { id: 'a3', name: 'BACON', price: 3.50 },
        { id: 'a4', name: 'CATUPIRY OU CHEDDAR', price: 3.00 },
        { id: 'a5', name: 'OVO', price: 2.00 },
        { id: 'a6', name: 'PRESUNTO', price: 2.00 },
        { id: 'a7', name: 'MUSSARELA', price: 2.50 }
    ];

    const bebidas = [
        { id: 'b1', name: 'COCA-COLA 2L', price: 12.00, desc: 'REFRIGERANTE GARRAFA 2 LITROS' },
        { id: 'b2', name: 'COCA-COLA LATA', price: 6.00, desc: 'LATA 350ML' },
        { id: 'b3', name: 'GUARANÁ ANTARCTICA 2L', price: 10.00, desc: 'REFRIGERANTE GARRAFA 2 LITROS' },
        { id: 'b4', name: 'SUCO NATURAL 500ML', price: 8.00, desc: 'SABOR LARANJA OU MARACUJÁ' },
        { id: 'b5', name: 'ÁGUA MINERAL', price: 4.00, desc: 'SEM GÁS 500ML' }
    ];

    // Estruturas de Dados
    const cartHamb = {}; // { h1: 2 }
    const selectedBurgers = []; // [{ uid: 'h1_1', id: 'h1', name: 'X FILÉ ESPECIAL', price: 24.00, addons: { a1: 1 } }]
    const cartBebidas = {}; // { b1: 1 }
    let currentBurgerIndex = 0;

    function initMenu() {
        renderCategory('hamb-list', hamburgueres, 'hamb');
        renderCategory('bebidas-list', bebidas, 'bebida');
    }

    function renderCategory(containerId, items, type) {
        const container = document.getElementById(containerId);
        container.innerHTML = items.map(item => `
            <div class="item-card">
                <div class="item-header">
                    <span class="item-title">${item.name}</span>
                    <span class="item-price">R$ ${item.price.toFixed(2).replace('.', ',')}</span>
                </div>
                <div class="item-desc">${item.desc}</div>
                <div class="counter-box">
                    <button class="btn-counter" onclick="updateQty('${item.id}', -1, '${type}')">-</button>
                    <span class="counter-value" id="qty-${type}-${item.id}">0</span>
                    <button class="btn-counter" onclick="updateQty('${item.id}', 1, '${type}')">+</button>
                </div>
            </div>
        `).join('');
    }

    function updateQty(id, change, type) {
        const cartObj = type === 'hamb' ? cartHamb : cartBebidas;
        const current = cartObj[id] || 0;
        const updated = Math.max(0, current + change);

        if (updated === 0) {
            delete cartObj[id];
        } else {
            cartObj[id] = updated;
        }

        document.getElementById(`qty-${type}-${id}`).innerText = updated;
        if (type === 'bebida') checkBebidasStatus();
    }

    function goToAddons() {
        selectedBurgers.length = 0; // Limpa seleção anterior de adicionais
        let counter = 1;

        // Cria instâncias individuais de cada hambúrguer selecionado
        for (const [id, qty] of Object.entries(cartHamb)) {
            const burgerInfo = hamburgueres.find(h => h.id === id);
            for (let i = 0; i < qty; i++) {
                selectedBurgers.push({
                    uid: `${id}_${i}`,
                    id: burgerInfo.id,
                    name: `${burgerInfo.name} (#${counter})`,
                    price: burgerInfo.price,
                    addons: {}
                });
                counter++;
            }
        }

        if (selectedBurgers.length === 0) {
            showScreen('screen-bebidas');
            return;
        }

        currentBurgerIndex = 0;
        renderAddonsTabs();
        renderAddonsList();
        showScreen('screen-addons');
    }

    function renderAddonsTabs() {
        const tabsContainer = document.getElementById('burger-tabs');
        tabsContainer.innerHTML = selectedBurgers.map((b, index) => `
            <button class="tab-btn ${index === currentBurgerIndex ? 'active' : ''}" onclick="selectBurgerTab(${index})">
                ${b.name}
            </button>
        `).join('');
    }

    function selectBurgerTab(index) {
        currentBurgerIndex = index;
        renderAddonsTabs();
        renderAddonsList();
    }

    function renderAddonsList() {
        const container = document.getElementById('addons-list');
        const currentBurger = selectedBurgers[currentBurgerIndex];

        container.innerHTML = listaAdicionais.map(addon => {
            const qty = currentBurger.addons[addon.id] || 0;
            return `
                <div class="item-card">
                    <div class="item-header">
                        <span class="item-title">${addon.name}</span>
                        <span class="item-price">+ R$ ${addon.price.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="counter-box" style="margin-top: 10px;">
                        <button class="btn-counter" onclick="updateAddonQty('${addon.id}', -1)">-</button>
                        <span class="counter-value">${qty}</span>
                        <button class="btn-counter" onclick="updateAddonQty('${addon.id}', 1)">+</button>
                    </div>
                </div>
            `;
        }).join('');

        checkAddonsStatus();
    }

    function updateAddonQty(addonId, change) {
        const currentBurger = selectedBurgers[currentBurgerIndex];
        const current = currentBurger.addons[addonId] || 0;
        const updated = Math.max(0, current + change);

        if (updated === 0) {
            delete currentBurger.addons[addonId];
        } else {
            currentBurger.addons[addonId] = updated;
        }

        renderAddonsList();
    }

    function checkAddonsStatus() {
        const hasAnyAddon = selectedBurgers.some(b => Object.keys(b.addons).length > 0);
        const btnNext = document.getElementById('btn-addons-next');
        btnNext.innerText = hasAnyAddon ? 'Próximo ➔' : 'Pular';
    }

    function checkBebidasStatus() {
        const hasBebida = bebidas.some(b => cartBebidas[b.id] && cartBebidas[b.id] > 0);
        const btnNext = document.getElementById('btn-bebidas-next');
        btnNext.innerText = hasBebida ? 'Próximo ➔' : 'Pular';
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo(0, 0);

        if (screenId === 'screen-checkout') {
            renderCheckout();
        }
    }

    function renderCheckout() {
        const summaryContainer = document.getElementById('checkout-summary');
        let total = 0;
        let html = '';

        // 1. Hambúrgueres e seus adicionais
        selectedBurgers.forEach(b => {
            let burgerTotal = b.price;
            html += `<div class="summary-item">
                        <span>1x ${b.name}</span>
                        <span>R$ ${b.price.toFixed(2).replace('.', ',')}</span>
                     </div>`;

            Object.entries(b.addons).forEach(([addonId, qty]) => {
                const addonInfo = listaAdicionais.find(a => a.id === addonId);
                const addonTotal = addonInfo.price * qty;
                burgerTotal += addonTotal;
                html += `<div class="summary-add-on">
                            <span>+ ${qty}x ${addonInfo.name}</span>
                            <span>R$ ${addonTotal.toFixed(2).replace('.', ',')}</span>
                         </div>`;
            });

            total += burgerTotal;
        });

        // 2. Bebidas
        bebidas.forEach(item => {
            const qty = cartBebidas[item.id] || 0;
            if (qty > 0) {
                const subtotal = item.price * qty;
                total += subtotal;
                html += `
                    <div class="summary-item" style="margin-top: 5px;">
                        <span>${qty}x ${item.name}</span>
                        <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                    </div>
                `;
            }
        });

        if (selectedBurgers.length === 0 && Object.keys(cartBebidas).length === 0) {
            html = '<p style="text-align:center; color: #aaa;">Nenhum item selecionado.</p>';
        } else {
            html += `
                <div class="summary-total summary-item">
                    <span>TOTAL:</span>
                    <span>R$ ${total.toFixed(2).replace('.', ',')}</span>
                </div>
            `;
        }

        summaryContainer.innerHTML = html;
    }

    function toggleTroco(value) {
        document.getElementById('troco-group').style.display = value === 'Dinheiro' ? 'block' : 'none';
    }

    function sendOrder(e) {
        e.preventDefault();

        if (selectedBurgers.length === 0 && Object.keys(cartBebidas).length === 0) {
            alert("Por favor, selecione ao menos um item para fazer o pedido.");
            return;
        }

        let total = 0;
        let orderText = "*NOVO PEDIDO DE ENTREGA*\n\n*ITENS SELECIONADOS:* \n";

        // Hambúrgueres + Adicionais
        selectedBurgers.forEach(b => {
            let burgerTotal = b.price;
            orderText += `\n🍔 *${b.name}* - R$ ${b.price.toFixed(2).replace('.', ',')}\n`;

            Object.entries(b.addons).forEach(([addonId, qty]) => {
                const addonInfo = listaAdicionais.find(a => a.id === addonId);
                const addonTotal = addonInfo.price * qty;
                burgerTotal += addonTotal;
                orderText += `   └ + ${qty}x ${addonInfo.name} (R$ ${addonTotal.toFixed(2).replace('.', ',')})\n`;
            });

            total += burgerTotal;
        });

        // Bebidas
        let temBebidaHeader = false;
        bebidas.forEach(item => {
            const qty = cartBebidas[item.id] || 0;
            if (qty > 0) {
                if (!temBebidaHeader) {
                    orderText += `\n🥤 *BEBIDAS:*\n`;
                    temBebidaHeader = true;
                }
                const subtotal = item.price * qty;
                total += subtotal;
                orderText += `• ${qty}x ${item.name} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
            }
        });

        orderText += `\n------------------------------`;
        orderText += `\n💰 *VALOR TOTAL:* R$ ${total.toFixed(2).replace('.', ',')}`;
        orderText += `\n------------------------------\n`;
        orderText += `\n*DADOS DE ENTREGA:*`;
        orderText += `\n👤 *Nome:* ${document.getElementById('nome').value}`;
        orderText += `\n📍 *Endereço:* ${document.getElementById('rua').value}, Nº ${document.getElementById('numero').value}`;
        orderText += `\n🏙️ *Bairro:* ${document.getElementById('bairro').value}`;
        orderText += `\n🗺️ *Ponto de Referência:* ${document.getElementById('referencia').value}`;
        
        const pag = document.getElementById('pagamento').value;
        orderText += `\n💳 *Forma de Pagamento:* ${pag}`;
        
        if (pag === 'Dinheiro') {
            const troco = document.getElementById('troco').value;
            orderText += troco ? ` (${troco})` : ` (Sem troco informado)`;
        }

        // Configure seu número de WhatsApp com DDD aqui:
        const phone = "5500000000000"; 
        const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(orderText)}`;
        
        window.open(url, '_blank');
    }

    initMenu();
</script>

</body>
</html>
