<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Social Media Cloud Premium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== 01 • LOGIN ==================== -->
<main id="login" class="page">
  <section class="top">
    <img src="assets/logo.png" class="logo">
    <div class="brand">Social Media Cloud Premium</div>
  </section>

  <form id="loginForm">
    <div class="input">
      <svg viewBox="0 0 24 24"><text x="2" y="19">@</text></svg>
      <input type="text" placeholder="Nome de usuário" required>
    </div>

    <div class="input">
      <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg>
      <input id="loginPass" type="password" placeholder="Sua senha secreta" required>
      <button type="button" onclick="togglePass('loginPass')">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>
    </div>

    <button class="gradient">ENTRAR NA NUVEM</button>
  </form>

  <p class="switch">Ainda não é membro?
    <button onclick="show('signup')">Criar Conta</button>
  </p>
</main>


<!-- ==================== 02 • SIGN UP / ETAPA 1 ==================== -->
<main id="signup" class="page hidden">
  <section class="top">
    <img src="assets/logo.png" class="logo">
    <div class="brand">Social Media Cloud Premium</div>
  </section>

  <form id="signupForm">
    <div class="input">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
      <input type="email" placeholder="Seu e-mail" required>
    </div>

    <div class="input">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <input type="text" placeholder="Nome de usuário" required>
    </div>

    <div class="input">
      <svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg>
      <input id="pass1" type="password" placeholder="Crie uma senha" required>
      <button type="button" onclick="togglePass('pass1')">◉</button>
    </div>

    <div class="input">
      <svg viewBox="0 0 24 24"><path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
      <input id="pass2" type="password" placeholder="Confirme sua senha" required>
      <button type="button" onclick="togglePass('pass2')">◉</button>
    </div>

    <button class="gradient">CRIAR CONTA</button>
  </form>

  <p class="switch">Já possui conta?
    <button onclick="show('login')">Entrar</button>
  </p>
</main>


<!-- ==================== 03 • SIGN UP / ETAPA 2 ==================== -->
<main id="identity" class="page identity hidden">

  <h1>Identidade</h1>

  <div class="profile-photo">
    <img id="avatar" src="assets/default-avatar.png">
    <label for="photo">📷</label>
    <input id="photo" type="file" accept="image/*">
  </div>

  <div class="avatar-list">
    <button>👩🏻</button>
    <button>👨🏽</button>
    <button>🧑🏾</button>
    <button>👩🏽</button>
  </div>

  <div class="progress"></div>

  <div class="input">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
    <input type="date">
    <span class="arrow">⌄</span>
  </div>

  <div class="input">
    <svg viewBox="0 0 24 24"><path d="M4 20c4-1 5-4 6-8l8-8 3 3-8 8c-4 1-5 2-9 5z"/></svg>
    <input type="text" placeholder="Bio: No que você é bom?">
  </div>

  <div class="gender">
    <button data-gender="male"><b>♂</b><small>ELE</small></button>
    <button data-gender="female"><b>♀</b><small>ELA</small></button>
    <button data-gender="neutral"><b>○</b><small>NEUTRO</small></button>
  </div>

  <button class="gradient">ENTRAR NA COMUNIDADE</button>
</main>


<script>
const ids=['login','signup','identity'];
function show(id){ids.forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function togglePass(id){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password'}

signupForm.onsubmit=e=>{
 e.preventDefault();
 if(pass1.value!==pass2.value)return alert('As senhas não são iguais.');
 show('identity');
};

photo.onchange=e=>{
 if(e.target.files[0])avatar.src=URL.createObjectURL(e.target.files[0]);
};

document.querySelectorAll('.gender button').forEach(b=>{
 b.onclick=()=>document.querySelectorAll('.gender button').forEach(x=>x.classList.toggle('selected',x===b));
});
</script>

</body>
  </html>
