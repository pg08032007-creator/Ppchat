<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Media Cloud Premium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 01 LOGIN -->
<main id="login" class="page">
  <header class="brand">
    <img src="assets/Logo.jpg">
    <h1>Social Media Cloud Premium</h1>
  </header>

  <form id="loginForm">
    <label class="field">@
      <input placeholder="Nome de usuário" required>
    </label>

    <label class="field">🔒
      <input id="lp" type="password" placeholder="Sua senha secreta" required>
      <button type="button" onclick="pass('lp')">◉</button>
    </label>

    <button class="gradient">ENTRAR NA NUVEM</button>
  </form>

  <p>Ainda não é membro?
    <button class="link" onclick="show('signup')">Criar Conta</button>
  </p>
</main>


<!-- 02 SIGN UP — ETAPA 1 -->
<main id="signup" class="page hide">
  <header class="brand">
    <img src="assets/logo.png">
    <h1>Social Media Cloud Premium</h1>
  </header>

  <form id="signupForm">
    <label class="field">✉
      <input type="email" placeholder="Seu e-mail" required>
    </label>

    <label class="field">♟
      <input placeholder="Nome de usuário" required>
    </label>

    <label class="field">🔒
      <input id="sp" type="password" placeholder="Crie uma senha" required>
      <button type="button" onclick="pass('sp')">◉</button>
    </label>

    <label class="field">🛡
      <input id="scp" type="password" placeholder="Confirme sua senha" required>
      <button type="button" onclick="pass('scp')">◉</button>
    </label>

    <button class="gradient">CRIAR CONTA</button>
  </form>

  <p>Já possui conta?
    <button class="link" onclick="show('login')">Entrar</button>
  </p>
</main>


<!-- 03 SIGN UP — ETAPA 2 -->
<main id="identity" class="page hide identity">
  <h2>Identidade</h2>

  <div class="avatar">
    <img id="preview" src="assets/default-avatar.png">
    <label for="photo">📷</label>
    <input id="photo" type="file" accept="image/*">
  </div>

  <div class="avatars">
    <button>👩🏻</button>
    <button>👨🏽</button>
    <button>🧑🏾</button>
    <button>👩🏽</button>
  </div>

  <div class="line"></div>

  <label class="field">▣
    <input type="date">
  </label>

  <label class="field">✎
    <input placeholder="Bio: No que você é bom?">
  </label>

  <div class="genders">
    <button>♂<small>ELE</small></button>
    <button>♀<small>ELA</small></button>
    <button>○<small>NEUTRO</small></button>
  </div>

  <button class="gradient">ENTRAR NA COMUNIDADE</button>
  <button class="back" onclick="show('signup')">← Voltar</button>
</main>


<script>
const pages=['login','signup','identity'];
function show(id){pages.forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id))}
function pass(id){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password'}

signupForm.onsubmit=e=>{
  e.preventDefault();
  if(sp.value!==scp.value)return alert('As senhas não são iguais.');
  show('identity');
};

photo.onchange=e=>{
  if(e.target.files[0])preview.src=URL.createObjectURL(e.target.files[0]);
};

document.querySelectorAll('.genders button').forEach(x=>{
  x.onclick=()=>document.querySelectorAll('.genders button').forEach(y=>y.classList.toggle('selected',y===x));
});
</script>

</body>
        </html>
