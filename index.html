<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil Genérico</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-dark:#0a0a0c;
      --bg-card:#141417;
      --accent-purple:#a855f7;
      --accent-pink:#ec4899;
      --text-main:#fff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:var(--bg-dark);
      color:var(--text-main);
    }

    .banner-container{
      width:100%;
      height:220px;
      background:#1a1a1e;
      position:relative;
      overflow:hidden;
      border-radius:0 0 30px 30px;
    }

    .banner-container img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .banner-container::after{
      content:"";
      position:absolute;
      bottom:0;
      left:0;
      width:100%;
      height:60%;
      background:linear-gradient(transparent,var(--bg-dark));
    }

    .profile{
      max-width:420px;
      margin:-70px auto 40px;
      position:relative;
      z-index:2;
      text-align:center;
      padding:0 20px;
    }

    .avatar{
      width:120px;
      height:120px;
      border-radius:50%;
      padding:4px;
      background:linear-gradient(45deg,var(--accent-purple),var(--accent-pink));
      margin:0 auto;
    }

    .avatar img{
      width:100%;
      height:100%;
      border-radius:50%;
      border:4px solid var(--bg-dark);
      object-fit:cover;
      background:var(--bg-dark);
    }

    h2{
      margin-top:14px;
      font-size:28px;
      font-weight:900;
    }

    .badge{
      display:inline-block;
      margin-left:8px;
      background:gold;
      color:black;
      font-size:10px;
      font-weight:900;
      padding:3px 7px;
      border-radius:6px;
      vertical-align:middle;
    }

    .gender{
      color:var(--accent-pink);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:1px;
      margin-top:4px;
    }

    .stats{
      display:flex;
      justify-content:center;
      gap:34px;
      margin:22px 0;
    }

    .stats div{
      text-align:center;
    }

    .stats b{
      display:block;
      font-size:22px;
      font-weight:800;
    }

    .stats span{
      font-size:11px;
      color:#8b8b95;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .bio{
      color:#b3b3bb;
      line-height:1.6;
      font-size:14px;
      max-width:340px;
      margin:0 auto 24px;
    }

    .btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      background:linear-gradient(135deg,var(--accent-purple),var(--accent-pink));
      color:#fff;
      font-weight:800;
      cursor:pointer;
      margin-bottom:26px;
    }

    .section-title{
      text-align:left;
      color:#7a7a84;
      font-size:11px;
      text-transform:uppercase;
      font-weight:900;
      letter-spacing:2px;
      margin-bottom:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
    }

    .grid img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:10px;
      border:1px solid #222;
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200" alt="Banner">
  </div>

  <div class="profile">

    <div class="avatar">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Usuario" alt="Avatar">
    </div>

    <h2>@usuario_generico <span class="badge">PRO</span></h2>

    <div class="gender">Neutro</div>

    <div class="stats">
      <div><b>1.245</b><span>Seguidores</span></div>
      <div><b>321</b><span>Seguindo</span></div>
      <div><b>48</b><span>Posts</span></div>
    </div>

    <div class="bio">
      Criador de conteúdo • Design • Tecnologia • Música • Sempre aprendendo algo novo.
    </div>

    <button class="btn">Editar Perfil</button>

    <div class="section-title">Galeria de Posts</div>

    <div class="grid">
      <img src="https://picsum.photos/300?random=1">
      <img src="https://picsum.photos/300?random=2">
      <img src="https://picsum.photos/300?random=3">
      <img src="https://picsum.photos/300?random=4">
      <img src="https://picsum.photos/300?random=5">
      <img src="https://picsum.photos/300?random=6">
      <img src="https://picsum.photos/300?random=7">
      <img src="https://picsum.photos/300?random=8">
      <img src="https://picsum.photos/300?random=9">
    </div>

  </div>

</body>
</html>
